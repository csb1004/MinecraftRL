[project]
name = "minecraftrl-policy-probe"
version = "0.1.0"
description = "Evidence-first VPT / STEVE-1 execution probe"
requires-python = ">=3.8"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minecraftrl = ["*.java"]
